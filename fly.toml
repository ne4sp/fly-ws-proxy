# fly.toml app configuration file generated for fly-ws-proxy-noble-frost-1997 on 2026-11-22T16:39:20+03:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'fly-ws-proxy-noble-frost-1997'
primary_region = 'arn'

[build]
[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1gb'
  cpus = 1
